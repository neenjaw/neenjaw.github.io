<footer class="site-footer">
  <div class="wrapper">
    <div>
      {{ site.title | escape }}
      {%- if site.email %} &middot; <a href="mailto:{{ site.email }}">{{ site.email }}</a>{% endif -%}
    </div>
    <div class="footer-links">
      {%- if site.github_username -%}<a href="https://github.com/{{ site.github_username }}">github</a>{%- endif -%}
      {%- if site.linkedin_username -%}<a href="https://www.linkedin.com/in/{{ site.linkedin_username }}">linkedin</a>{%- endif -%}
      <a href="{{ '/feed.xml' | relative_url }}">rss</a>
    </div>
  </div>
</footer>
