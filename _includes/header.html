<header class="site-header" role="banner">
  <a class="site-identity" rel="author" href="{{ '/' | relative_url }}">
    <span class="site-signal"></span>
    <span class="site-wordmark">NEENJAW</span>
  </a>

  <nav class="site-nav" aria-label="Main navigation">
    {%- for path in site.header_pages -%}
      {%- assign my_page = site.pages | where: "path", path | first -%}
      {%- if my_page.title -%}
        <a href="{{ my_page.url | relative_url }}"
           {% if page.url == my_page.url %}aria-current="page"{% endif %}>
          {{ my_page.title | escape }}
        </a>
      {%- endif -%}
    {%- endfor -%}
  </nav>
</header>
