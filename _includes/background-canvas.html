<canvas id="bgCanvas" aria-hidden="true"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  (() => {
    function noise3(x, y, z) {
      return (
        (Math.sin(x * 1.3 + y * 0.7 + z * 1.1) +
          Math.sin(x * 2.1 - y * 1.7 + z * 0.4) * 0.5 +
          Math.sin(x * 0.6 + y * 2.3 - z * 1.9) * 0.25) /
        1.75
      );
    }

    const canvas = document.getElementById("bgCanvas");
    const styles = getComputedStyle(document.documentElement);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      100,
    );
    camera.position.set(0, 0, 6);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      alpha: false,
      antialias: true,
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(styles.getPropertyValue("--color-dark-bg").trim(), 1);

    const geometry = new THREE.IcosahedronGeometry(1, 2);
    const basePositions = geometry.attributes.position.array.slice();
    const wireMat = new THREE.MeshBasicMaterial({
      color: styles.getPropertyValue("--color-wireframe").trim(),
      wireframe: true,
      transparent: true,
      opacity: 0.9,
    });
    const shape = new THREE.Mesh(geometry, wireMat);
    scene.add(shape);

    function sizeShape() {
      const dist = camera.position.z - shape.position.z || camera.position.z;
      const visibleHeight = 2 * Math.tan((camera.fov * Math.PI) / 360) * dist;
      const visibleWidth = visibleHeight * camera.aspect;

      shape.scale.setScalar(visibleWidth * 0.85);
      shape.position.set(-visibleWidth / 2, visibleHeight / 2, -1);
    }

    function resize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      sizeShape();
    }
    window.addEventListener("resize", resize);
    resize();

    let t = 0;
    const SPEED = 0.00018;
    let mouseX = 0;
    let mouseY = 0;
    let mouseXSmooth = 0;
    let mouseYSmooth = 0;
    const prefersReducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)",
    ).matches;

    if (!prefersReducedMotion) {
      window.addEventListener("pointermove", (event) => {
        mouseX = (event.clientX / window.innerWidth) * 2 - 1;
        mouseY = (event.clientY / window.innerHeight) * 2 - 1;
      });
    }

    function displace() {
      const position = geometry.attributes.position;
      for (let i = 0; i < position.count; i++) {
        const index = i * 3;
        const bx = basePositions[index];
        const by = basePositions[index + 1];
        const bz = basePositions[index + 2];
        const ambient = noise3(
          bx * 0.6 + t,
          by * 0.6 + t,
          bz * 0.6,
        );
        const cursorPull = noise3(
          bx * 0.6 + mouseXSmooth * 2.0,
          by * 0.6 + mouseYSmooth * 2.0,
          bz * 0.6 + t * 0.3,
        );
        const scale = 1 + (ambient * 0.7 + cursorPull * 0.3) * 0.09;
        position.array[index] = bx * scale;
        position.array[index + 1] = by * scale;
        position.array[index + 2] = bz * scale;
      }
      position.needsUpdate = true;
    }

    function animate() {
      requestAnimationFrame(animate);
      t += SPEED;
      mouseXSmooth += (mouseX - mouseXSmooth) * 0.02;
      mouseYSmooth += (mouseY - mouseYSmooth) * 0.02;
      displace();
      shape.rotation.x = t * 0.5;
      shape.rotation.y = t * 0.8;
      renderer.render(scene, camera);
    }

    if (prefersReducedMotion) {
      renderer.render(scene, camera);
    } else {
      animate();
    }
  })();
</script>
