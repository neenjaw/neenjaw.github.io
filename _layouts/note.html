---
layout: default
---

<article class="note">
  <header class="note-header">
    <p class="note-meta">
      <time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%b %-d, %Y" }}
      </time>
      {%- if page.devlog -%}
        {%- assign devlog = site.devlogs | where: "slug", page.devlog | first -%}
        {%- if devlog -%}
          <span class="devlog-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
              <path d="M0 0 L10 0 L10 10"/>
              <path d="M0 10 L10 0"/>
            </svg>
            <span class="devlog-badge-text">DEVLOG / {{ devlog.title | upcase }}</span>
          </span>
        {%- endif -%}
      {%- endif -%}
    </p>
  </header>

  <div class="note-content e-content">{{ content }}</div>

  <a class="u-url" href="{{ page.url | relative_url }}" hidden></a>
</article>
